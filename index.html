<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bharat Culture Atlas — Preserving Voices, Connecting Generations</title>

    <!-- Cultural Typography & Intangible Heritage Aesthetic Links -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@400;500;600&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Leaflet CSS for India Map & District Overlays -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <meta name="description" content="Bharat Culture Atlas is a community-powered digital repository preserving India's oral traditions, folk songs, dialects, rituals, and indigenous knowledge through AI-assisted preservation and interactive discovery." />

    <style>
      /* Slow Fade-in of floating illustrations defined in UI spec */
      .illustration-fade {
        animation: illustrationFade 2.5s ease-out forwards;
        opacity: 0;
      }
      @keyframes illustrationFade {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 0.85; transform: translateY(0px); }
      }
    </style>
  </head>
  <body class="font-sans antialiased text-charcoal-900 bg-cream-100">
    <div id="root">
      <!-- Minimal loading view while Javascript loads for modern UX -->
      <div style="display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; background-color: #FAF8F3;">
        <svg fill="none" class="illustration-fade illustration-logo" height="60" viewBox="0 0 100 100" width="60" xmlns="http://www.w3.org/2000/svg" style="animation: illustrationFade 1s 0.2s ease-out forwards;">
          <circle cx="50" cy="50" fill="#E07A1F" r="48" style="opacity:0.1;"/>
          <path d="M72 50 C 72 62.15, 62.15 72, 50 72 C 37.85 72, 28 62.15, 28 50 C 28 37.85, 37.85 28, 50 28 C 62.15 28, 72 37.85, 72 50 Z" stroke="#E07A1F" stroke-width="5"/>
          <path d="M50 20 L 50 80 M 20 50 L 80 50" stroke="#E07A1F" stroke-dasharray="2 3" stroke-width="0.7"/>
          <circle cx="50" cy="50" fill="#2E7D32" r="6" style="opacity:0.6;"/>
        </svg>
        <span style="color: #E07A1F; font-family: 'Poppins', sans-serif; font-weight:600; font-size: 1.15rem; margin-top: 20px;">Protecting the Soul of India™</span>
        <span style="color: #374151; font-family: 'Inter', sans-serif; font-size: 0.9rem; margin-top: 10px;">Loading Bharata Samskriti Koordisha...</span>
      </div>
    </div>

    <!-- Add Framer Motion floated illustrations as required by UI Spec -->
    <svg fill="none" class="illustration-fade float-diya illustration-flower" height="80" viewBox="0 0 100 100" width="80" xmlns="http://www.w3.org/2000/svg" style="position:fixed; top:12%; left:5%; animation: illustrationFade 3s 0.3s ease-out forwards; opacity:0; color:#F59E0B">
        <path d="M10 50a40 40 0 0 1 80 0a40 40 0 0 1 -10 25a25 25 0 0 1 -30 15a25 25 0 0 1 -30 -15a40 40 0 0 1 -10 -25Z" fill="white" stroke="#D97706" stroke-width="1.5" style="fill-opacity:0.8"/>
        <path d="M10 50 C 10 30, 90 30, 90 50" stroke="#D97706" stroke-dasharray="2 2" stroke-width="0.5"/>
        <path d="M50 20 C 50 2, 45 10, 45 10 C 20 50, 80 50, 55 10 C 55 10, 50 2, 50 20 Z" fill="#F59E0B" fill-opacity="0.9" stroke="none" transform="translate(0 -5)"/>
        <circle cx="50" cy="20" fill="#E07A1F" r="3" transform="translate(0, -4)"/>
    </svg>
    <svg fill="none" class="illustration-fade float-kathakali illustration-dance" height="110" viewBox="0 0 100 100" width="110" xmlns="http://www.w3.org/2000/svg" style="position:fixed; bottom:8%; right:-2%; animation: illustrationFade 3.5s 0.6s ease-out forwards; opacity:0; color:#2E7D32">
        <path d="M22 60a35 35 0 0 1 56 0a35 35 0 0 1 -7 20a18 18 0 0 1 -21 12a18 18 0 0 1 -21 -12a35 35 0 0 1 -7 -20Z" fill="white" stroke="#2E7D32" stroke-width="1" style="fill-opacity:0.8"/>
        <path d="M10 32 L 90 32 M 50 12 L 50 92" stroke="#2E7D32" stroke-dasharray="1 2" stroke-width="0.3"/>
        <path d="M40 92 A 40 100 0 0 1 60 92 Z" fill="#EEEEE4" stroke="#D5CBBB" stroke-width="0.5"/>
        <path d="M48 60 A 2 2 0 0 0 52 60 A 2 2 0 0 0 48 60 Z" fill="#111827" stroke="white" stroke-width="1"/>
        <path d="M40 40 L 60 40 M 36 44 L 64 44 M 35 48 A 6 6 0 0 0 65 48 A 15 15 0 0 0 35 48 Z" fill="#2E7D32" stroke="#FAF8F3" stroke-width="2"/>
        <path d="M22 68 C 30 75, 70 75, 78 68 C 72 80, 28 80, 22 68 Z" fill="#C86613"/>
    </svg>

    <script type="module" src="/src/main.tsx"></script>

    <!-- User Authentication & Session state is persisted here, synced to useAtlasStore.real Auth token in real Supabase production. -->
    <script>
      const atlas_explorer = localStorage.getItem('atlas_explorer') || '[]';
      localStorage.setItem('atlas_explorer', atlas_explorer);
    </script>
  </body>
</html>
